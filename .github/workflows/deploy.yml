name: CI/CD

# Pull requests: lint and build. Pushes to main: also deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Reports the site's path (/juliocesar for this project site), so the
      # base path follows the repository name
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run lint
      # Also type-checks
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Deployed through Actions, so Pages serves the files as they are (no
      # Jekyll, which would drop the _next/ folder)
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: out/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
